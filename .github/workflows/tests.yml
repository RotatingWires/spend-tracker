name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build SpendTracker.csproj --nologo
      - run: python3 -m unittest discover -s tests -p "test_api.py" -v
      - run: python3 -m unittest discover -s tests -p "test_import_tool.py" -v
